<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">One active concentration spell at a time</title>
  <desc id="diagram-description">A rules diagram shows one active concentration choice leading to one of four example spells: Hex, Hypnotic Pattern, Invisibility, or Fly. A red branch shows that starting another concentration spell ends the first; damage may trigger a Constitution saving throw.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172A3A" flood-opacity="0.12" />
    </filter>
    <marker id="teal-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#3B7F79" />
    </marker>
    <marker id="red-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#D85B4A" />
    </marker>
    <linearGradient id="main-panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E8F7F3" />
      <stop offset="1" stop-color="#F7FCFA" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1520" fill="#F7F4EE" />
  <rect x="32" y="32" width="1136" height="1456" rx="32" fill="none" stroke="#D6D0C6" stroke-width="3" />

  <text x="72" y="108" fill="#3B7F79" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">CONCENTRATION CHECK</text>
  <text x="72" y="184" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="58" font-weight="800">One active concentration spell</text>
  <text x="72" y="248" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="48" font-weight="700">at a time</text>
  <text x="72" y="300" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="30" font-weight="500">Prepare several options, but plan the encounter around one.</text>

  <rect x="64" y="350" width="1072" height="870" rx="28" fill="url(#main-panel)" stroke="#B6DED5" stroke-width="3" filter="url(#shadow)" />
  <rect x="64" y="350" width="18" height="870" rx="9" fill="#3B7F79" />

  <rect x="316" y="402" width="568" height="112" rx="24" fill="#172A3A" />
  <circle cx="370" cy="458" r="24" fill="#F2C14E" />
  <text x="370" y="468" text-anchor="middle" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="900">1</text>
  <text x="414" y="450" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">ACTIVE CONCENTRATION</text>
  <text x="414" y="486" fill="#D9E5E7" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="600">one maintained spell</text>

  <path d="M600 514 C600 548 600 558 600 588" fill="none" stroke="#3B7F79" stroke-width="7" />
  <path d="M584 574 L600 610 L616 574 Z" fill="#3B7F79" />
  <rect x="404" y="610" width="392" height="92" rx="18" fill="#FFFFFF" stroke="#B6DED5" stroke-width="3" />
  <text x="600" y="666" text-anchor="middle" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">CHOOSE ONE</text>

  <text x="112" y="778" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="2">EXAMPLE CONCENTRATION SPELLS</text>
  <text x="112" y="822" fill="#42535D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="600">Each card is an option for the same active slot.</text>

  <g fill="#FFFFFF" stroke="#B6DED5" stroke-width="3">
    <rect x="112" y="866" width="470" height="122" rx="18" />
    <rect x="618" y="866" width="470" height="122" rx="18" />
    <rect x="112" y="1020" width="470" height="122" rx="18" />
    <rect x="618" y="1020" width="470" height="122" rx="18" />
  </g>
  <g fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="35" font-weight="800">
    <text x="150" y="938">Hex</text>
    <text x="656" y="938">Hypnotic Pattern</text>
    <text x="150" y="1092">Invisibility</text>
    <text x="656" y="1092">Fly</text>
  </g>
  <g fill="#65727A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="25" font-weight="600">
    <text x="150" y="970">concentration option</text>
    <text x="656" y="970">concentration option</text>
    <text x="150" y="1124">concentration option</text>
    <text x="656" y="1124">concentration option</text>
  </g>

  <path d="M888 458 C1000 458 1040 542 1040 610" fill="none" stroke="#D85B4A" stroke-width="7" />
  <path d="M1024 596 L1040 632 L1056 596 Z" fill="#D85B4A" />
  <rect x="848" y="640" width="240" height="126" rx="18" fill="#FFF0E5" stroke="#F1C2A5" stroke-width="3" />
  <text x="968" y="684" text-anchor="middle" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="22" font-weight="800">START ANOTHER</text>
  <text x="968" y="717" text-anchor="middle" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="22" font-weight="800">CONCENTRATION</text>
  <text x="968" y="751" text-anchor="middle" fill="#5D514B" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="22" font-weight="700">ends the first</text>

  <rect x="64" y="1254" width="1072" height="128" rx="20" fill="#172A3A" />
  <circle cx="112" cy="1318" r="20" fill="#F2C14E" />
  <text x="112" y="1328" text-anchor="middle" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="900">!</text>
  <text x="151" y="1310" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700">Damage may trigger a Constitution</text>
  <text x="151" y="1348" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700">saving throw; incapacitation or death ends it.</text>

  <text x="72" y="1438" fill="#6F777C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="22" font-weight="600">Mark concentration on the worksheet before assigning either Pact Magic slot.</text>
</svg>
