<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Level-5 Warlock spell choices and Pact Magic slots</title>
  <desc id="diagram-description">A vertical rules diagram separates six prepared spell choices from two level-3 Pact Magic slots, then shows a lower-level spell being cast with a level-3 slot. A footer reminds the reader that concentration is a separate one-active-spell limit.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172A3A" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#D85B4A" />
    </marker>
    <linearGradient id="prepared-panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E8F7F3" />
      <stop offset="1" stop-color="#F4FBF8" />
    </linearGradient>
    <linearGradient id="slot-panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF0E5" />
      <stop offset="1" stop-color="#FFF8F1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1660" fill="#F7F4EE" />
  <rect x="32" y="32" width="1136" height="1596" rx="32" fill="none" stroke="#D6D0C6" stroke-width="3" />

  <text x="72" y="108" fill="#3B7F79" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">2024 BASIC RULES • LEVEL 5 CASE</text>
  <text x="72" y="184" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="60" font-weight="800">Spell choices ≠ spell slots</text>
  <text x="72" y="248" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="48" font-weight="700">A level-5 Warlock worksheet</text>
  <text x="72" y="298" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="30" font-weight="500">Keep the two budgets separate before you choose a name.</text>

  <rect x="64" y="350" width="1072" height="560" rx="28" fill="url(#prepared-panel)" stroke="#B6DED5" stroke-width="3" filter="url(#shadow)" />
  <rect x="64" y="350" width="18" height="560" rx="9" fill="#3B7F79" />
  <text x="112" y="414" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">PREPARED SPELLS</text>
  <rect x="844" y="378" width="238" height="58" rx="29" fill="#3B7F79" />
  <text x="963" y="416" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="800">6 BASE NAMES</text>
  <text x="112" y="468" fill="#42535D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="31" font-weight="600">The list you carry into the session</text>

  <g fill="#FFFFFF" stroke="#B6DED5" stroke-width="3">
    <rect x="112" y="510" width="470" height="100" rx="18" />
    <rect x="618" y="510" width="470" height="100" rx="18" />
    <rect x="112" y="640" width="470" height="100" rx="18" />
    <rect x="618" y="640" width="470" height="100" rx="18" />
    <rect x="112" y="770" width="470" height="100" rx="18" />
    <rect x="618" y="770" width="470" height="100" rx="18" />
  </g>
  <g fill="#3B7F79" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">
    <circle cx="157" cy="560" r="25" fill="#D8F0EB" />
    <text x="157" y="570">1</text>
    <circle cx="663" cy="560" r="25" fill="#D8F0EB" />
    <text x="663" y="570">2</text>
    <circle cx="157" cy="690" r="25" fill="#D8F0EB" />
    <text x="157" y="700">3</text>
    <circle cx="663" cy="690" r="25" fill="#D8F0EB" />
    <text x="663" y="700">4</text>
    <circle cx="157" cy="820" r="25" fill="#D8F0EB" />
    <text x="157" y="830">5</text>
    <circle cx="663" cy="820" r="25" fill="#D8F0EB" />
    <text x="663" y="830">6</text>
  </g>
  <g fill="#65727A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="600">
    <text x="205" y="570">write one prepared spell</text>
    <text x="711" y="570">write one prepared spell</text>
    <text x="205" y="700">write one prepared spell</text>
    <text x="711" y="700">write one prepared spell</text>
    <text x="205" y="830">write one prepared spell</text>
    <text x="711" y="830">write one prepared spell</text>
  </g>

  <rect x="64" y="950" width="1072" height="530" rx="28" fill="url(#slot-panel)" stroke="#F1C2A5" stroke-width="3" filter="url(#shadow)" />
  <rect x="64" y="950" width="18" height="530" rx="9" fill="#D85B4A" />
  <text x="112" y="1014" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">PACT MAGIC SLOTS</text>
  <rect x="824" y="978" width="258" height="58" rx="29" fill="#D85B4A" />
  <text x="953" y="1016" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="30" font-weight="800">2 × LEVEL 3</text>
  <text x="112" y="1068" fill="#5D514B" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="31" font-weight="600">The two spell slots you can spend</text>

  <g>
    <rect x="112" y="1106" width="466" height="116" rx="20" fill="#FFFFFF" stroke="#F1C2A5" stroke-width="3" />
    <rect x="622" y="1106" width="466" height="116" rx="20" fill="#FFFFFF" stroke="#F1C2A5" stroke-width="3" />
    <text x="145" y="1151" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1">SLOT 1</text>
    <text x="145" y="1192" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="39" font-weight="800">LEVEL 3</text>
    <text x="655" y="1151" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1">SLOT 2</text>
    <text x="655" y="1192" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="39" font-weight="800">LEVEL 3</text>
  </g>

  <text x="112" y="1280" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1">SPELL LEVEL</text>
  <rect x="112" y="1300" width="350" height="92" rx="16" fill="#FFFDF9" stroke="#F1C2A5" stroke-width="3" />
  <text x="287" y="1357" text-anchor="middle" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">1st or 2nd</text>
  <path d="M492 1346 C555 1346 612 1346 675 1346" fill="none" stroke="#D85B4A" stroke-width="7" marker-end="url(#arrow)" />
  <path d="M668 1330 L704 1346 L668 1362 Z" fill="#D85B4A" />
  <text x="585" y="1315" text-anchor="middle" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="25" font-weight="700">cast using</text>
  <rect x="730" y="1300" width="358" height="92" rx="16" fill="#FFFDF9" stroke="#F1C2A5" stroke-width="3" />
  <text x="909" y="1357" text-anchor="middle" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">a level-3 slot</text>

  <text x="112" y="1428" fill="#5D514B" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="600">The slot is level 3; the effect changes only when that spell’s</text>
  <text x="112" y="1465" fill="#5D514B" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="600">own upcast rule says it does.</text>

  <rect x="64" y="1500" width="1072" height="94" rx="18" fill="#172A3A" />
  <circle cx="112" cy="1547" r="20" fill="#F2C14E" />
  <text x="112" y="1557" text-anchor="middle" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="900">!</text>
  <text x="151" y="1557" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="700">Separate check: concentration is one active spell at a time.</text>

  <text x="72" y="1620" fill="#6F777C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="22" font-weight="600">Use the worksheet to choose jobs; do not read it as a universal “best six.”</text>
</svg>
