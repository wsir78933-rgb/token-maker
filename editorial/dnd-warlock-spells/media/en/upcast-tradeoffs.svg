<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1820" viewBox="0 0 1200 1820" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">What selected 2024 Warlock spells change at a level-3 slot</title>
  <desc id="diagram-description">A five-row comparison shows the property change for Hex, Invisibility, Fly, Dispel Magic, and Misty Step when each is cast with a level-3 slot. A footer notes that this is not a damage ranking.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172A3A" flood-opacity="0.12" />
    </filter>
    <linearGradient id="header-panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E8F7F3" />
      <stop offset="1" stop-color="#F7FCFA" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1820" fill="#F7F4EE" />
  <rect x="32" y="32" width="1136" height="1756" rx="32" fill="none" stroke="#D6D0C6" stroke-width="3" />

  <text x="72" y="108" fill="#3B7F79" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">2024 UPCAST READBACK</text>
  <text x="72" y="184" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="57" font-weight="800">Compare the change with the job</text>
  <text x="72" y="244" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="46" font-weight="700">before spending a level-3 slot</text>
  <text x="72" y="296" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="500">A higher slot is useful only when the spell text changes a property you need.</text>

  <rect x="64" y="334" width="1072" height="106" rx="22" fill="url(#header-panel)" stroke="#B6DED5" stroke-width="3" filter="url(#shadow)" />
  <rect x="94" y="360" width="210" height="54" rx="27" fill="#3B7F79" />
  <text x="199" y="396" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="800">SPELL</text>
  <path d="M318 387 L350 387" fill="none" stroke="#D85B4A" stroke-width="6" />
  <path d="M344 373 L374 387 L344 401 Z" fill="#D85B4A" />
  <rect x="388" y="360" width="290" height="54" rx="27" fill="#D85B4A" />
  <text x="533" y="396" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="800">LEVEL-3 SLOT</text>
  <path d="M692 387 L724 387" fill="none" stroke="#D85B4A" stroke-width="6" />
  <path d="M718 373 L748 387 L718 401 Z" fill="#D85B4A" />
  <rect x="762" y="360" width="342" height="54" rx="27" fill="#172A3A" />
  <text x="933" y="396" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="800">CHECK THE PROPERTY</text>

  <rect x="64" y="474" width="1072" height="1170" rx="26" fill="#FFFDF9" stroke="#D6D0C6" stroke-width="3" filter="url(#shadow)" />
  <rect x="90" y="502" width="240" height="66" rx="14" fill="#172A3A" />
  <rect x="356" y="502" width="280" height="66" rx="14" fill="#172A3A" />
  <rect x="662" y="502" width="448" height="66" rx="14" fill="#172A3A" />
  <text x="210" y="545" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800">SPELL</text>
  <text x="496" y="545" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800">AT A LEVEL-3 SLOT</text>
  <text x="886" y="545" text-anchor="middle" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800">WHAT ACTUALLY CHANGES</text>

  <g>
    <rect x="90" y="594" width="1020" height="180" rx="16" fill="#E8F7F3" stroke="#B6DED5" stroke-width="3" />
    <rect x="90" y="594" width="12" height="180" rx="6" fill="#3B7F79" />
    <text x="130" y="670" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="37" font-weight="800">Hex</text>
    <text x="130" y="716" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">1st-level spell</text>
    <text x="410" y="670" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">3rd-level slot</text>
    <text x="410" y="716" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">same target</text>
    <text x="690" y="670" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="33" font-weight="800">8-hour maximum</text>
    <text x="690" y="716" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="33" font-weight="800">concentration</text>
  </g>

  <g>
    <rect x="90" y="798" width="1020" height="180" rx="16" fill="#FFF0E5" stroke="#F1C2A5" stroke-width="3" />
    <rect x="90" y="798" width="12" height="180" rx="6" fill="#D85B4A" />
    <text x="130" y="874" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="37" font-weight="800">Invisibility</text>
    <text x="130" y="920" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">2nd-level spell</text>
    <text x="410" y="874" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">3rd-level slot</text>
    <text x="410" y="920" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">one extra target</text>
    <text x="690" y="874" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="33" font-weight="800">2 targets total</text>
    <text x="690" y="920" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="700">+1 above 2nd level</text>
  </g>

  <g>
    <rect x="90" y="1002" width="1020" height="180" rx="16" fill="#E8F7F3" stroke="#B6DED5" stroke-width="3" />
    <rect x="90" y="1002" width="12" height="180" rx="6" fill="#3B7F79" />
    <text x="130" y="1078" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="37" font-weight="800">Fly</text>
    <text x="130" y="1124" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">3rd-level spell</text>
    <text x="410" y="1078" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">3rd-level slot</text>
    <text x="410" y="1124" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">same target</text>
    <text x="690" y="1078" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="33" font-weight="800">1 target at 3rd</text>
    <text x="690" y="1124" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="700">extra targets start above 3rd</text>
  </g>

  <g>
    <rect x="90" y="1206" width="1020" height="180" rx="16" fill="#FFF0E5" stroke="#F1C2A5" stroke-width="3" />
    <rect x="90" y="1206" width="12" height="180" rx="6" fill="#D85B4A" />
    <text x="130" y="1282" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="37" font-weight="800">Dispel Magic</text>
    <text x="130" y="1328" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">3rd-level spell</text>
    <text x="410" y="1282" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">3rd-level slot</text>
    <text x="410" y="1328" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">higher threshold</text>
    <text x="690" y="1282" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="33" font-weight="800">automatic ending</text>
    <text x="690" y="1328" fill="#9E3F34" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="700">through 3rd level</text>
  </g>

  <g>
    <rect x="90" y="1410" width="1020" height="180" rx="16" fill="#E8F7F3" stroke="#B6DED5" stroke-width="3" />
    <rect x="90" y="1410" width="12" height="180" rx="6" fill="#3B7F79" />
    <text x="130" y="1486" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="37" font-weight="800">Misty Step</text>
    <text x="130" y="1532" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="600">2nd-level spell</text>
    <text x="410" y="1486" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="34" font-weight="800">3rd-level slot</text>
    <text x="410" y="1532" fill="#5B6670" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="23" font-weight="600">same movement text</text>
    <text x="690" y="1486" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="33" font-weight="800">no listed improvement</text>
    <text x="690" y="1532" fill="#23615D" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="29" font-weight="700">in the selected source</text>
  </g>

  <rect x="64" y="1668" width="1072" height="78" rx="18" fill="#172A3A" />
  <circle cx="112" cy="1707" r="19" fill="#F2C14E" />
  <text x="112" y="1717" text-anchor="middle" fill="#172A3A" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="26" font-weight="900">≠</text>
  <text x="151" y="1717" fill="#FFFFFF" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="27" font-weight="800">NOT A DAMAGE RANKING</text>
  <text x="72" y="1780" fill="#6F777C" font-family="Avenir Next, Inter, Arial, sans-serif" font-size="22" font-weight="600">Compare the changed property with the job and its opportunity cost.</text>
</svg>
