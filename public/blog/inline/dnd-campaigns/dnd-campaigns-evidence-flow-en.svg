<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" role="img" aria-labelledby="evidence-title evidence-description">
  <title id="evidence-title">Match the reader's brief to an official product field</title>
  <desc id="evidence-description">A selection aid, not a ranking. Each row connects a reader input, an official field, and an editorial action. Both products explicitly address new players and new Dungeon Masters and display Fifth Edition labels. Icespire states one to five players, a level-1 start, and levels 1 to 7. Phandelver states levels 1 to 12; its player count and separate starting instruction remain not stated. A separate note records Phandelver's statement that fifth-edition content remains playable and that the 5.5e revisions are designed to be fully compatible with it. This compatibility statement is distinct from either product's exact label and from the group's rules choice.</desc>
  <metadata>Official sources: https://marketplace.dndbeyond.com/adventures/SRC-00041 ; https://marketplace.dndbeyond.com/adventures/phandelver-and-below?pid=SRC-00113</metadata>
  <defs>
    <marker id="evidence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#6b7f8c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="evidence-row-arrows" fill="none" stroke="#6b7f8c" stroke-width="2" marker-end="url(#evidence-arrow)">
      <path d="M 306 0 H 382"/>
      <path d="M 766 0 H 848"/>
    </g>
  </defs>
