    <rect x="32" y="992" width="1176" height="142" rx="14" fill="#eaf0f4" stroke="#c9d4db" stroke-width="1.5"/>
    <text x="56" y="1027" font-size="22" font-weight="700">Compatibility statement: separate from the product labels</text>
    <text x="56" y="1060" font-size="20">Phandelver's “5.5e and BEYOND!”: fifth-edition content remains playable;</text>
    <text x="56" y="1090" font-size="20">the 5.5e revisions are designed to be fully compatible with it.</text>
    <text x="56" y="1119" font-size="19" fill="#4d626f">Choose the group's rules, then check any specific use still unanswered.</text>
    <text x="40" y="1170" font-size="20">A level band and an explicit starting instruction are separate fields.</text>
    <text x="40" y="1203" font-size="18" fill="#4d626f">Sources: official Essentials Kit and Phandelver and Below descriptions. No scores or ranking.</text>
