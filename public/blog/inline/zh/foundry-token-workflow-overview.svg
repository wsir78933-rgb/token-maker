<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="90" x2="1460" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1420"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111A26"/>
      <stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FB7FF"/>
      <stop offset="1" stop-color="#D7B46A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1320" cy="170" r="180" fill="#7FA7D6" fill-opacity="0.12"/>
  <circle cx="1490" cy="660" r="240" fill="#D7B46A" fill-opacity="0.1"/>
  <circle cx="170" cy="760" r="160" fill="#8FB7FF" fill-opacity="0.08"/>

  <rect x="90" y="76" width="138" height="44" rx="22" fill="#101824" stroke="#7FA7D6" stroke-opacity="0.45"/>
  <text x="125" y="105" fill="#D5E7FF" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif" letter-spacing="3">实战流程</text>
  <text x="90" y="188" fill="#F8F5EE" font-size="60" font-family="Georgia, PingFang SC, Noto Serif SC, serif">Foundry VTT Token</text>
  <text x="90" y="262" fill="#F8F5EE" font-size="60" font-family="Georgia, PingFang SC, Noto Serif SC, serif">从原图到导入的最小闭环</text>
  <text x="90" y="326" fill="#C6CFDA" font-size="28" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">先做对路线，再做对裁切、边缘、尺寸、格式和 Prototype Token。</text>

  <g transform="translate(90 410)">
    <rect width="250" height="254" rx="30" fill="url(#panel)" stroke="#8FB7FF" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="26" y="24" width="60" height="60" rx="20" fill="#111F30" stroke="#8FB7FF" stroke-opacity="0.5"/>
    <text x="47" y="63" fill="#DCEBFF" font-size="26" font-family="Avenir Next, sans-serif">01</text>
    <text x="26" y="124" fill="#F6F1E8" font-size="32" font-family="Georgia, PingFang SC, Noto Serif SC, serif">先定路线</text>
    <text x="26" y="170" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">静态边框</text>
    <text x="26" y="204" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">或 Dynamic Ring</text>
    <text x="26" y="236" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">别两边都做得很重</text>
  </g>

  <g transform="translate(390 410)">
    <rect width="250" height="254" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="26" y="24" width="60" height="60" rx="20" fill="#1B1409" stroke="#D7B46A" stroke-opacity="0.55"/>
    <text x="47" y="63" fill="#F8E7C4" font-size="26" font-family="Avenir Next, sans-serif">02</text>
    <text x="26" y="124" fill="#F6F1E8" font-size="32" font-family="Georgia, PingFang SC, Noto Serif SC, serif">裁切主体</text>
    <text x="26" y="170" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">脸部或轮廓</text>
    <text x="26" y="204" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">缩小后仍可识别</text>
    <text x="26" y="236" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">不要舍不得背景</text>
  </g>

  <g transform="translate(690 410)">
    <rect width="250" height="254" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="26" y="24" width="60" height="60" rx="20" fill="#111F30" stroke="#8FB7FF" stroke-opacity="0.5"/>
    <text x="47" y="63" fill="#DCEBFF" font-size="26" font-family="Avenir Next, sans-serif">03</text>
    <text x="26" y="124" fill="#F6F1E8" font-size="32" font-family="Georgia, PingFang SC, Noto Serif SC, serif">清理边缘</text>
    <text x="26" y="170" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">深色图不发灰</text>
    <text x="26" y="204" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">浅色图不发脏</text>
    <text x="26" y="236" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">透明比滤镜更重要</text>
  </g>

  <g transform="translate(990 410)">
    <rect width="250" height="254" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="26" y="24" width="60" height="60" rx="20" fill="#1B1409" stroke="#D7B46A" stroke-opacity="0.55"/>
    <text x="47" y="63" fill="#F8E7C4" font-size="26" font-family="Avenir Next, sans-serif">04</text>
    <text x="26" y="124" fill="#F6F1E8" font-size="32" font-family="Georgia, PingFang SC, Noto Serif SC, serif">导出交付</text>
    <text x="26" y="170" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">母版 PNG</text>
    <text x="26" y="204" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">上传版 WebP</text>
    <text x="26" y="236" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">默认 512，长期 1024</text>
  </g>

  <g transform="translate(1290 410)">
    <rect width="220" height="254" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="24" y="24" width="60" height="60" rx="20" fill="#111F30" stroke="#8FB7FF" stroke-opacity="0.5"/>
    <text x="45" y="63" fill="#DCEBFF" font-size="26" font-family="Avenir Next, sans-serif">05</text>
    <text x="24" y="124" fill="#F6F1E8" font-size="32" font-family="Georgia, PingFang SC, Noto Serif SC, serif">导入</text>
    <text x="24" y="170" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Prototype Token</text>
    <text x="24" y="204" fill="#D2D7DE" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">再批量管理</text>
    <text x="24" y="236" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Wildcard 变体也在这里</text>
  </g>

  <path d="M347 537H382" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M647 537H682" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M947 537H982" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M1247 537H1282" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M374 523L394 537L374 551" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M674 523L694 537L674 551" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M974 523L994 537L974 551" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1274 523L1294 537L1274 551" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="90" y="786" fill="#F2E6C8" font-size="24" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Token Maker Blog</text>
  <text x="1240" y="786" fill="#9EABB9" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Foundry workflow overview</text>
</svg>
