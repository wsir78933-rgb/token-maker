<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1420"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111A26"/>
      <stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FB7FF"/>
      <stop offset="1" stop-color="#D7B46A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1340" cy="180" r="180" fill="#7FA7D6" fill-opacity="0.12"/>
  <circle cx="1480" cy="690" r="250" fill="#D7B46A" fill-opacity="0.1"/>
  <circle cx="170" cy="760" r="160" fill="#8FB7FF" fill-opacity="0.08"/>

  <rect x="90" y="76" width="152" height="44" rx="22" fill="#101824" stroke="#7FA7D6" stroke-opacity="0.45"/>
  <text x="125" y="105" fill="#D5E7FF" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif" letter-spacing="3">通用流程</text>
  <text x="90" y="186" fill="#F8F5EE" font-size="60" font-family="Georgia, PingFang SC, Noto Serif SC, serif">VTT Token</text>
  <text x="90" y="260" fill="#F8F5EE" font-size="60" font-family="Georgia, PingFang SC, Noto Serif SC, serif">从选图到导入的最小闭环</text>
  <text x="90" y="324" fill="#C6CFDA" font-size="28" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">先定平台和用途，再做裁切、边框、尺寸、格式，最后导入 Roll20 或 Foundry。</text>

  <g transform="translate(90 410)">
    <rect width="220" height="246" rx="30" fill="url(#panel)" stroke="#8FB7FF" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="24" y="24" width="60" height="60" rx="20" fill="#111F30" stroke="#8FB7FF" stroke-opacity="0.5"/>
    <text x="45" y="63" fill="#DCEBFF" font-size="26" font-family="Avenir Next, sans-serif">01</text>
    <text x="24" y="124" fill="#F6F1E8" font-size="31" font-family="Georgia, PingFang SC, Noto Serif SC, serif">先定用途</text>
    <text x="24" y="170" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">跨平台资产</text>
    <text x="24" y="202" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">还是平台专用</text>
    <text x="24" y="232" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">这一步决定后面大半策略</text>
  </g>

  <g transform="translate(340 410)">
    <rect width="220" height="246" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="24" y="24" width="60" height="60" rx="20" fill="#1B1409" stroke="#D7B46A" stroke-opacity="0.55"/>
    <text x="45" y="63" fill="#F8E7C4" font-size="26" font-family="Avenir Next, sans-serif">02</text>
    <text x="24" y="124" fill="#F6F1E8" font-size="31" font-family="Georgia, PingFang SC, Noto Serif SC, serif">选对原图</text>
    <text x="24" y="170" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">缩小后仍可识别</text>
    <text x="24" y="202" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">背景不要抢主体</text>
    <text x="24" y="232" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Token 不是海报</text>
  </g>

  <g transform="translate(590 410)">
    <rect width="220" height="246" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="24" y="24" width="60" height="60" rx="20" fill="#111F30" stroke="#8FB7FF" stroke-opacity="0.5"/>
    <text x="45" y="63" fill="#DCEBFF" font-size="26" font-family="Avenir Next, sans-serif">03</text>
    <text x="24" y="124" fill="#F6F1E8" font-size="31" font-family="Georgia, PingFang SC, Noto Serif SC, serif">裁切主体</text>
    <text x="24" y="170" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">优先脸和轮廓</text>
    <text x="24" y="202" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">不要贪背景</text>
    <text x="24" y="232" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">好用的 Token 往往更近</text>
  </g>

  <g transform="translate(840 410)">
    <rect width="220" height="246" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="24" y="24" width="60" height="60" rx="20" fill="#1B1409" stroke="#D7B46A" stroke-opacity="0.55"/>
    <text x="45" y="63" fill="#F8E7C4" font-size="26" font-family="Avenir Next, sans-serif">04</text>
    <text x="24" y="124" fill="#F6F1E8" font-size="31" font-family="Georgia, PingFang SC, Noto Serif SC, serif">选形状</text>
    <text x="24" y="170" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">圆形、方形</text>
    <text x="24" y="202" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">或透明主体</text>
    <text x="24" y="232" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">边框是分类，不是装饰</text>
  </g>

  <g transform="translate(1090 410)">
    <rect width="220" height="246" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="24" y="24" width="60" height="60" rx="20" fill="#111F30" stroke="#8FB7FF" stroke-opacity="0.5"/>
    <text x="45" y="63" fill="#DCEBFF" font-size="26" font-family="Avenir Next, sans-serif">05</text>
    <text x="24" y="124" fill="#F6F1E8" font-size="31" font-family="Georgia, PingFang SC, Noto Serif SC, serif">选尺寸</text>
    <text x="24" y="170" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">默认 512</text>
    <text x="24" y="202" fill="#D2D7DE" font-size="21" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">长期资产 1024</text>
    <text x="24" y="232" fill="#97A5B5" font-size="18" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">别把像素和占格混为一谈</text>
  </g>

  <g transform="translate(1340 410)">
    <rect width="170" height="246" rx="30" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="20" y="24" width="60" height="60" rx="20" fill="#1B1409" stroke="#D7B46A" stroke-opacity="0.55"/>
    <text x="41" y="63" fill="#F8E7C4" font-size="26" font-family="Avenir Next, sans-serif">06</text>
    <text x="20" y="124" fill="#F6F1E8" font-size="30" font-family="Georgia, PingFang SC, Noto Serif SC, serif">导入</text>
    <text x="20" y="170" fill="#D2D7DE" font-size="20" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Roll20</text>
    <text x="20" y="200" fill="#D2D7DE" font-size="20" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Foundry</text>
    <text x="20" y="230" fill="#97A5B5" font-size="17" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">保存默认设置</text>
  </g>

  <path d="M317 535H332" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M567 535H582" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M817 535H832" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M1067 535H1082" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M1317 535H1332" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M326 523L340 535L326 547" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M576 523L590 535L576 547" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M826 523L840 535L826 547" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1076 523L1090 535L1076 547" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1326 523L1340 535L1326 547" stroke="#D7B46A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="90" y="790" fill="#F2E6C8" font-size="24" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">Token Maker Blog</text>
  <text x="1262" y="790" fill="#9EABB9" font-size="22" font-family="Avenir Next, PingFang SC, Noto Sans SC, sans-serif">VTT workflow overview</text>
</svg>
