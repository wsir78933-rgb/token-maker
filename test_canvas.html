<!DOCTYPE html>
<html><body>
<canvas id="c" width="512" height="512"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  
  const img = new Image();
  img.src = 'public/borders/blueenergy366.webp';
  img.onload = () => {
    // Replicate drawBorder
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 512;
    offCanvas.height = 512;
    const oCtx = offCanvas.getContext('2d');
    
    oCtx.drawImage(img, 0, 0, 512, 512);
    oCtx.globalCompositeOperation = 'multiply';
    oCtx.fillStyle = '#8b5cf6';
    oCtx.fillRect(0, 0, 512, 512);
    oCtx.globalCompositeOperation = 'destination-in';
    oCtx.drawImage(img, 0, 0, 512, 512);
    
    ctx.fillStyle = 'white';
    ctx.fillRect(0,0,512,512);
    ctx.drawImage(offCanvas, 0, 0);

    const pixels = ctx.getImageData(256, 256, 1, 1).data;
    console.log("Center pixel:", pixels); 
    document.body.innerHTML += `<p>Center pixel: ${pixels}</p>`;
  }
</script>
</body></html>
