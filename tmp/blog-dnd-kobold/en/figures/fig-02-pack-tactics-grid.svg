<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pack Tactics five-foot grid</title>
  <desc id="desc">1 square equals 5 feet. Two Small kobolds each occupy one square adjacent to a Medium fighter: ally within 5 ft yields Pack Tactics. A lone kobold adjacent to the fighter has no Pack Tactics.</desc>
