  <rect x="28" y="28" width="1480" height="968" rx="28" fill="#e8dcc6"/>
  <text x="768" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#1c160f">Pack Tactics</text>
  <text x="768" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#844424">1 square = 5 ft    ·    Small occupies 1 square</text>
