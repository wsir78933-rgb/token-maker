    <rect x="52" y="230" width="700" height="28" fill="#2e7a4a"/>
    <text x="402" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff">ally within 5 ft</text>
    <text x="402" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff">→ Pack Tactics</text>
